    <path d="M190 116 L234 116 L234 106 Q212 96 190 106 Z"/>
    <path d="M190 242 L190 166 Q212 150 234 166 L234 242 Z"/>
    <circle cx="596" cy="136" r="22"/>
    <path d="M574 120 L618 120 L618 110 Q596 100 574 110 Z"/>
    <path d="M574 242 L574 170 Q596 154 618 170 L618 242 Z"/>
  </g>
  <g fill="#1b2a4a" opacity=".85">
    <circle cx="404" cy="112" r="28"/>
    <path d="M376 92 L432 92 L432 80 Q404 68 376 80 Z"/>
    <path d="M374 242 L374 152 Q404 130 434 152 L434 242 Z"/>
  </g>
