  <path d="M640 196 L640 100" stroke="#1b2a4a" stroke-width="6"/>
  <!-- 两只探照灯：大检查的光 -->
  <path d="M120 0 L120 46" stroke="#1b2a4a" stroke-width="4"/>
  <circle cx="120" cy="60" r="14" fill="#f2b233" stroke="#1b2a4a" stroke-width="4"/>
  <path d="M120 74 L40 240 L200 240 Z" fill="#f2b233" opacity=".14"/>
  <path d="M690 0 L690 40" stroke="#1b2a4a" stroke-width="4"/>
