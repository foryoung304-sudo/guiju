<svg xmlns="http://www.w3.org/2000/svg" width="820" height="328" viewBox="0 0 820 328" role="img" aria-label="卫生大检查·剪影">
  <rect width="820" height="328" fill="#f3e6cf"/>
  <rect x="0" y="242" width="820" height="86" fill="#1b2a4a" opacity=".16"/>
